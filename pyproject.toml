[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-polymorphic-payload-deobfuscator"
version = "0.1.0"
description = "Recursive multi-encoding decoder unwrapping base64, rot13, hex, zero-width spaces, and homoglyphs in untrusted inputs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-polymorphic-payload-deobfuscator = "agent_polymorphic_payload_deobfuscator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_polymorphic_payload_deobfuscator*"]
